name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and verified test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m coverage run -m pytest -q
      - name: Enforce coverage threshold
        run: python -m coverage report --fail-under=90
      - name: Run deterministic mutation probes
        run: python tools/manual_mutation_suite.py
      - name: Replay example certificate with standalone verifier
        run: >-
          python tools/verify_paired_certificate_standalone.py
          --artifact evidence/artefact/example_certificate.json
          --raw evidence/artefact/example_raw.csv
          --schema schemas/pcpi_paired_candidate_certificate.schema.json
      - name: Build installable wheel
        run: python -m pip wheel . --no-deps -w dist
